<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>星算速算家 — 小学算术速算闯关</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body {
    width:100%; height:100%; overflow:hidden;
    background: linear-gradient(160deg,#2B1B47,#1A1030);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select:none; user-select:none;
  }
  #stage {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
  }
  canvas {
    display:block;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
    border-radius: 2px;
    touch-action: none;
  }
  #hint {
    position:absolute; left:50%; bottom:10px; transform:translateX(-50%);
    color:rgba(255,255,255,.45); font-size:12px; letter-spacing:.5px;
    pointer-events:none; text-align:center; line-height:1.6;
  }
  #boot {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:16px;
    background:#1A1030; color:#fff; z-index:10; transition:opacity .4s;
  }
  #boot .t { font-size:22px; font-weight:700; }
  #boot .s { font-size:13px; color:rgba(255,255,255,.6); }
  @media (max-width:500px){ #hint{ display:none; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
</div>
<div id="hint">点击屏幕选择年级与角色 · 数字键与退格键答题 · 桌面端可直接用键盘 0-9 / Backspace</div>
<div id="boot">
  <div class="t">星算速算家</div>
  <div class="s">正在加载…</div>
</div>

<script type="module">
/**
 * H5 预览版入口
 * ------------------------------------------------------------------
 * 与微信小游戏共用同一份shared/ 与miniprogram/ 源码（ESM 原生 import）。
 * 这就是「单一事实源」的价值：改一处，两端同时生效。
 */
import { bootstrap } from '../miniprogram/core/app.js';

// 页面位于 /web/，素材在 /miniprogram/，故需注入资源根
const ASSET_ROOT = '../miniprogram/';

const canvas = document.getElementById('game');
const boot = document.getElementById('boot');

try {
  // 等图片就绪再隐藏启动屏，避免闪白
  const app = bootstrap(canvas, 'web', ASSET_ROOT);
  window.__APP__ = app;

  // 预载主角，减少首次答题时的等待
  let loaded = 0;
  const need = 4;
  const paths = [
    'assets/characters/bunny_sleep.png',
    'assets/characters/bunny_star.png',
    'assets/characters/bunny_jump.png',
    'assets/characters/rabbit.png'
  ].map(p => ASSET_ROOT + p);
  paths.forEach(p => {
    const img = new Image();
    img.onload = img.onerror = () => { if (++loaded >= need) finish(); };
    img.src = p;
  });
  function finish() {
    boot.style.opacity = '0';
    setTimeout(() => boot.remove(), 420);
  }
  setTimeout(finish, 2500);   // 兜底，避免某图失败卡在启动屏
} catch (e) {
  boot.querySelector('.s').textContent = '启动失败：' + e.message;
  boot.querySelector('.s').style.color = '#FF6B6B';
  console.error(e);
}
</script>
</body>
</html>
